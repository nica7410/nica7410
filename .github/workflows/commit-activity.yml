name: Update commit-only profile statistics

on:
  schedule:
    - cron: "25 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate commit-only contribution stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_commit_stats.py
      - name: Publish updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/commit-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh commit-only stats"
            git push
          fi
